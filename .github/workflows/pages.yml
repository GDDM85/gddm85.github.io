name: GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Disable Jekyll on published site
        run: |
          # Ensure GitHub Pages won't try to run Jekyll on the published artifact
          mkdir -p dist
          touch dist/.nojekyll
      - uses: actions/configure-pages@v4
      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Download pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pages
          path: pages

      - name: Move artifact contents into workspace
        run: |
          bash -lc 'shopt -s dotglob && cp -r pages/* . && rm -rf pages'

      - uses: actions/deploy-pages@v2
